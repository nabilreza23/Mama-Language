name: Test Mama Language

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-mama-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/parent-action@v1 # Set up standard python
      with:
        python-version: '3.10'

    - name: Run Mama Script
      run: |
        python mama.py test.mama
